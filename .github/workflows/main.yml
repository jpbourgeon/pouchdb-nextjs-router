name: continuous-integration

on:
  pull_request:
    types: ["opened", "edited", "reopened", "synchronize"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v2.1.5
        with:
          node-version: "24.x"

      - name: Checkout pouchdb
        run: git clone --depth 1 https://github.com/pouchdb/pouchdb.git

      - name: Checkout pouchdb-nextjs-router
        uses: actions/checkout@v7
        with:
          path: "pouchdb-nextjs-router"

      - name: Install pouchdb
        run: |
          cd pouchdb
          npm install
          npm run build

      - name: Install pouchdb-nextjs-router
        run: |
          cd pouchdb-nextjs-router
          npm ci
          NODE_OPTIONS=--openssl-legacy-provider npm run build

      - name: Commitlint pull request name
        uses: JulienKode/pull-request-name-linter-action@v0.2.0
        with:
          configuration-path: ./pouchdb-nextjs-router/commitlint.config.js

      - name: Lint pouchdb-nextjs-router
        run: |
          cd pouchdb-nextjs-router
          npm run lint

      - name: Test pouchdb-nextjs-router against pouchdb testsuite
        env:
          BAIL: 0
        run: |
          cd pouchdb-nextjs-router
          # PouchDB's upstream integration suite contains historically intermittent
          # tests. Mocha --retries 2 handles intra-run flakes, but global state,
          # timing, or concurrency can still affect every attempt in one process.
          # Retry one complete npm test invocation for an independent setup, server,
          # probe, and suite run. Two failed full runs remain blocking, without
          # weakening assertions.
          echo "RUN 1: START"
          if npm run test; then
            echo "RUN 1: PASS"
          else
            echo "RUN 1: FAIL"
            echo "Full-suite retry triggered after first failed run"
            echo "RUN 2: START"
            if npm run test; then
              echo "RUN 2: PASS"
            else
              run_status=$?
              echo "RUN 2: FAIL"
              exit "$run_status"
            fi
          fi
